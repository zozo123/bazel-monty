sandbox: bazel-monty-islo
image: ghcr.io/islo-labs/islo-runner:latest
cpu: 8
memory_mb: 16384
disk_gb: 80
workdir: /workspace/bazel-monty

setup_scripts:
  - name: java-and-bazelisk
    script: |
      set -euo pipefail
      if command -v apt-get >/dev/null 2>&1; then
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl unzip zip
        sudo update-ca-certificates
      fi
      ./scripts/bootstrap_bazelisk.sh
